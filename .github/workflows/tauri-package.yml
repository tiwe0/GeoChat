name: tauri-package

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  # Keep only the newest package attempt for each branch/PR. Release tags
  # remain isolated so a release build cannot cancel another release build.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: nsis,msi
            artifact_glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: macos
            os: macos-latest
            bundles: app,dmg
            artifact_glob: |
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The public checkout retains legacy workspace entries in bun.lock that
      # are not present in this sanitized tree. --no-save keeps CI installs
      # reproducible without rewriting the tracked lockfile.
      - name: Install JavaScript dependencies
        run: bun install --no-save

      - name: Build Tauri bundles
        run: bunx tauri build --bundles "${{ matrix.bundles }}"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geochat-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: ${{ matrix.artifact_glob }}

  release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: geochat-*
          path: release-assets
          merge-multiple: true

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -print)
          if (( ${#assets[@]} == 0 )); then
            echo 'No Windows or macOS installer assets were downloaded.' >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" --clobber "${assets[@]}"
          else
            gh release create "$TAG_NAME" --generate-notes "${assets[@]}"
          fi
