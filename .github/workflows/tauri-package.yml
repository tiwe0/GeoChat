name: tauri-package

on:
  push:
    branches: [master]
    tags: ['v*']
    # The marketing site has its own workflow; changing copy must not spend
    # half an hour of macOS and Windows runner time. Only website/** is
    # ignored — a release commit always touches version files outside it, so
    # this cannot cause a tag to skip its build.
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

concurrency:
  # Keep only the newest package attempt for each branch/PR. Release tags
  # remain isolated so a release build cannot cancel another release build.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs before the platform builds, for two reasons.
  #
  # Correctness: `tauri build` only runs `tauri:prepare`, which is a Vite
  # build. Vite strips types with esbuild and never typechecks, and nothing in
  # the packaging path runs the test suite — so a dependency bump with breaking
  # type changes goes green here and breaks on master. That is what happened to
  # ai 7, TypeScript 7 and @ai-sdk/alibaba 2, each merged and then reverted.
  #
  # Cost: a type error now fails in about a minute on a Linux runner instead of
  # after an eight-minute Windows build.
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JavaScript dependencies
        run: bun install --no-save

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test tests

      - name: Validate benchmark suite
        run: bun run benchmark:validate

      - name: Prepare Tauri resources
        run: bun run tauri:prepare

      - name: Test Tauri Rust shell
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Harness evaluation
        if: always()
        run: bun run eval:harness

      - name: Upload harness evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geochat-harness-evals-${{ github.sha }}
          if-no-files-found: warn
          path: .artifacts/agent-harness-evals.xml

  package:
    name: Package (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: nsis,msi
            artifact_glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: macos
            os: macos-latest
            bundles: app,dmg
            artifact_glob: |
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The public checkout retains legacy workspace entries in bun.lock that
      # are not present in this sanitized tree. --no-save keeps CI installs
      # reproducible without rewriting the tracked lockfile.
      - name: Install JavaScript dependencies
        run: bun install --no-save

      - name: Build Tauri bundles
        run: bunx tauri build --bundles "${{ matrix.bundles }}"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geochat-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: ${{ matrix.artifact_glob }}

  release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: geochat-*
          path: release-assets
          merge-multiple: true

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -print)
          if (( ${#assets[@]} == 0 )); then
            echo 'No Windows or macOS installer assets were downloaded.' >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" --clobber "${assets[@]}"
          else
            gh release create "$TAG_NAME" --generate-notes "${assets[@]}"
          fi

  mirror:
    name: Mirror installers to Cloudflare R2
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: geochat-*
          path: release-assets
          merge-multiple: true

      # Everything below is skipped rather than failed when R2 is not
      # configured, so the GitHub Release remains the source of truth and a
      # missing secret never blocks a release. The website falls back to the
      # GitHub API on its own when latest.json is absent.
      - name: Check R2 configuration
        id: config
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET }}
          DOWNLOADS_BASE: ${{ vars.DOWNLOADS_BASE_URL }}
        shell: bash
        run: |
          if [[ -n "$API_TOKEN" && -n "$ACCOUNT_ID" && -n "$BUCKET" && -n "$DOWNLOADS_BASE" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::R2 mirroring skipped. Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets plus the R2_BUCKET and DOWNLOADS_BASE_URL variables to enable it.'
          fi

      - name: Set up Node
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build download manifest
        if: steps.config.outputs.ready == 'true'
        env:
          TAG_NAME: ${{ github.ref_name }}
          DOWNLOADS_BASE: ${{ vars.DOWNLOADS_BASE_URL }}
        shell: bash
        run: |
          node scripts/build-r2-download-manifest.mjs \
            --assets release-assets \
            --tag "$TAG_NAME" \
            --base "$DOWNLOADS_BASE" \
            --repo "$GITHUB_REPOSITORY" \
            --out release-assets/latest.json

      - name: Upload installers and manifest to R2
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET }}
          PREFIX: ${{ vars.R2_PREFIX || 'geochat' }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          put() {
            npx --yes wrangler@4 r2 object put "$1" \
              --file="$2" \
              --content-type="$3" \
              --cache-control="$4" \
              --remote
          }

          # Installers live under a per-tag prefix and never change, so they are
          # cached for a year.
          uploaded=0
          for file in release-assets/**/*.dmg release-assets/**/*.exe release-assets/**/*.msi; do
            [[ -f "$file" ]] || continue
            name="$(basename "$file")"
            case "$name" in
              *.dmg) type='application/x-apple-diskimage' ;;
              *.msi) type='application/x-msi' ;;
              *)     type='application/vnd.microsoft.portable-executable' ;;
            esac

            echo "Uploading $name"
            put "$BUCKET/$PREFIX/$TAG_NAME/$name" "$file" "$type" \
              'public, max-age=31536000, immutable'
            uploaded=$((uploaded + 1))
          done

          if (( uploaded == 0 )); then
            echo 'No installers were found to mirror.' >&2
            exit 1
          fi

          # latest.json is overwritten every release, so it gets a short TTL —
          # cache it for long and the download page keeps offering the previous
          # version. Uploaded last so it never points at objects that are not
          # there yet.
          put "$BUCKET/$PREFIX/latest.json" release-assets/latest.json \
            'application/json' 'public, max-age=300'

          echo "Mirrored $uploaded installer(s) to $BUCKET/$PREFIX/$TAG_NAME/"
