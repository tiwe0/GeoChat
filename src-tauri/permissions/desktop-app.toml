[[set]]
identifier = "desktop-app"
description = "Allows the GeoChat renderer to call the desktop application's public commands."
permissions = [
  "allow-get-runtime-info",
  "allow-get-renderer-storage",
  "allow-set-renderer-storage",
  "allow-remove-renderer-storage",
  "allow-get-graphics-preferences",
  "allow-set-graphics-preferences",
  "allow-get-mcp-status",
  "allow-set-mcp-enabled",
  "allow-get-access-state",
  "allow-check-access",
  "allow-get-update-state",
  "allow-check-for-updates",
  "allow-check-all-updates",
  "allow-download-update",
  "allow-set-update-preferences",
  "allow-get-improvement-plan-preferences",
  "allow-set-improvement-plan-preferences",
  "allow-upload-improvement-plan-samples",
  "allow-get-logging-preferences",
  "allow-set-logging-preferences",
  "allow-open-log-directory",
  "allow-write-app-log",
  "allow-get-app-bundle-update-state",
  "allow-check-app-bundle-update",
  "allow-install-app-bundle-update",
  "allow-rollback-app-bundle-update",
  "allow-get-problem-bank-cache-state",
  "allow-get-problem-bank-catalog",
  "allow-get-problem-bank-download-states",
  "allow-download-problem-bank",
  "allow-open-problem-bank-cache-directory",
  "allow-clear-problem-bank-cache",
  "allow-check-problem-bank-update",
  "allow-sync-problem-bank-metadata",
  "allow-load-problem-bank-page",
  "allow-load-problem-detail",
  "allow-save-provider-credential",
  "allow-delete-provider-credential",
  "allow-list-provider-credential-metadata",
  "allow-mark-renderer-ready",
  "allow-install-update",
]
