[package]
name = "geochat-desktop-tauri"
version = "0.7.0"
description = "Canvas-first AI mathematics workspace powered by GeoGebra"
authors = ["GeoChat"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "~2.7.1", features = [] }

[dependencies]
base64 = "0.23"
log = "0.4"
pem = "4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "~2.12.1", default-features = false, features = ["wry"] }
tauri-plugin-log = "~2.10.0"
tauri-plugin-opener = { version = "~2.6.0", default-features = false }
tauri-plugin-updater = { version = "~2.13.0", default-features = false, features = ["rustls-tls"] }
time = { version = "0.3", features = ["formatting"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
