<!doctype html>
<!--
  Source for public/og.png. Regenerate with:
    node scripts/generate-og.mjs

  Uses the same self-hosted fonts, notation colors and circumcircle geometry as
  the site itself, so the share card and the page it links to look like one
  thing. Coordinates are the projection of A(-3,-1) B(3,-1) C(1,3), O(0,0),
  r=sqrt(10) at scale 59.09 with origin (260,226).
-->
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("../public/fonts/archivo-latin.woff2") format("woff2");
        font-weight: 400 700;
        font-display: block;
      }
      @font-face {
        font-family: "Source Serif 4";
        src: url("../public/fonts/source-serif-4-latin.woff2") format("woff2");
        font-weight: 400;
        font-display: block;
      }
      :root {
        --paper: oklch(0.987 0.002 250);
        --ink: oklch(0.22 0.012 250);
        --ink-soft: oklch(0.435 0.011 250);
        --construct: oklch(0.45 0.17 262);
        --result: oklch(0.47 0.185 30);
        --rule: oklch(0.885 0.004 250);
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: var(--paper);
        color: var(--ink);
        font-family: "Archivo", "PingFang SC", sans-serif;
        display: grid;
        grid-template-columns: 1fr 560px;
        align-items: center;
        gap: 40px;
        padding: 72px 76px;
        overflow: hidden;
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      h1 {
        margin-top: 34px;
        font-size: 92px;
        line-height: 1.0;
        font-weight: 600;
        letter-spacing: -0.04em;
      }
      h1 span {
        display: block;
      }
      .given { color: var(--ink); }
      .construct { color: var(--construct); }
      .result { color: var(--result); }
      p {
        margin-top: 34px;
        max-width: 20em;
        font-size: 25px;
        line-height: 1.5;
        color: var(--ink-soft);
      }
      .meta {
        margin-top: 26px;
        font-size: 19px;
        color: var(--ink-soft);
        display: flex;
        gap: 14px;
      }
      svg text {
        font-family: "Source Serif 4", serif;
        font-style: italic;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="var(--construct)" stroke-width="1.6" />
          <circle cx="12" cy="12" r="1.9" fill="var(--result)" />
          <path d="M12 12 L21 12" stroke="var(--ink)" stroke-width="1.6" />
        </svg>
        GeoChat
      </div>

      <h1>
        <span class="given">已知</span>
        <span class="construct">作图</span>
        <span class="result">结论</span>
      </h1>

      <p>本地优先的 AI 数学作图工作台。输入题目，它作图，也讲图。</p>

      <div class="meta">
        <span>macOS · Windows</span>
        <span>·</span>
        <span>Apache-2.0 开源</span>
      </div>
    </div>

    <svg width="520" height="452" viewBox="0 0 520 452" fill="none">
      <!-- perpendicular bisectors, clipped by the viewBox -->
      <path d="M 260 0 L 260 452" stroke="var(--construct)" stroke-width="2" opacity="0.9" />
      <path d="M 0 356 L 520 96" stroke="var(--construct)" stroke-width="2" opacity="0.9" />

      <!-- triangle ABC -->
      <path
        d="M 82.7 285.1 L 437.3 285.1 L 319.1 48.7 Z"
        stroke="var(--ink)"
        stroke-width="2.2"
        stroke-linejoin="round"
      />

      <!-- circumcircle, r = 186.85 -->
      <circle cx="260" cy="226" r="186.85" stroke="var(--result)" stroke-width="2.4" />

      <circle cx="82.7" cy="285.1" r="5" fill="var(--ink)" stroke="var(--paper)" stroke-width="2.5" />
      <circle cx="437.3" cy="285.1" r="5" fill="var(--ink)" stroke="var(--paper)" stroke-width="2.5" />
      <circle cx="319.1" cy="48.7" r="5" fill="var(--ink)" stroke="var(--paper)" stroke-width="2.5" />
      <circle cx="260" cy="226" r="5" fill="var(--construct)" stroke="var(--paper)" stroke-width="2.5" />

      <text x="62" y="311" fill="var(--ink)">A</text>
      <text x="449" y="311" fill="var(--ink)">B</text>
      <text x="331" y="40" fill="var(--ink)">C</text>
      <text x="272" y="218" fill="var(--construct)">O</text>
    </svg>
  </body>
</html>
