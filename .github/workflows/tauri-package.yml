name: tauri-package

on:
  push:
    branches: [master]
    tags: ['v*']
    # The marketing site has its own workflow; changing copy must not spend
    # half an hour of macOS and Windows runner time. Only website/** is
    # ignored — a release commit always touches version files outside it, so
    # this cannot cause a tag to skip its build.
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* tag to rebuild and publish with this workflow (empty for build only)'
        required: false
        type: string

concurrency:
  # Keep only the newest package attempt for each branch/PR. Release tags
  # remain isolated so a release build cannot cancel another release build.
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs before the platform builds, for two reasons.
  #
  # Correctness: `tauri build` only runs `tauri:prepare`, which is a Vite
  # build. Vite strips types with esbuild and never typechecks, and nothing in
  # the packaging path runs the test suite — so a dependency bump with breaking
  # type changes goes green here and breaks on master. That is what happened to
  # ai 7, TypeScript 7 and @ai-sdk/alibaba 2, each merged and then reverted.
  #
  # Cost: a type error now fails in about a minute on a Linux runner instead of
  # after an eight-minute Windows build.
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Rust
        # Keep lint and packaging on the same locally validated compiler.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            ripgrep

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript quality gates
        run: bun run quality:check

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Tauri build.rs validates resource paths even during clippy on a clean runner.
      - name: Prepare Tauri resources
        run: bun run tauri:prepare

      - name: Lint Rust targets
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: bun test tests

      - name: Validate benchmark suite
        run: bun run benchmark:validate

      - name: Test Tauri Rust shell
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Harness evaluation
        if: always()
        run: bun run eval:harness

      - name: Upload harness evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geochat-harness-evals-${{ github.sha }}
          if-no-files-found: warn
          path: .artifacts/agent-harness-evals.xml

  package:
    name: Package (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: nsis,msi
            artifact_glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: macos
            os: macos-latest
            bundles: app,dmg
            artifact_glob: |
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri bundles
        run: bunx tauri build --bundles "${{ matrix.bundles }}"

      - name: Test native credential storage on target platform
        run: cargo test --manifest-path src-tauri/Cargo.toml credentials::platform::tests

      - name: Smoke packaged layout
        env:
          GEOCHAT_TAURI_PACKAGE_EVIDENCE_PATH: .artifacts/package-smoke/layout-${{ matrix.platform }}.json
        run: bun run tauri:package:smoke

      - name: Smoke packaged backend authentication
        env:
          GEOCHAT_PACKAGED_BACKEND_EVIDENCE_PATH: .artifacts/package-smoke/backend-${{ matrix.platform }}.json
        run: bun run package:backend-smoke

      # macOS launches the executable inside the generated .app bundle.
      # Windows launches target/release/geochat-desktop-tauri.exe; this does
      # not claim that either the NSIS or MSI installer was installed.
      - name: Smoke platform launch target
        env:
          GEOCHAT_PACKAGED_LAUNCH_EVIDENCE_PATH: .artifacts/package-smoke/launch-${{ matrix.platform }}.json
        run: bun run package:launch-smoke

      - name: Upload package smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: .artifacts/package-smoke/*.json

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geochat-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          path: ${{ matrix.artifact_glob }}

  release:
    name: Publish GitHub Release assets
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: geochat-*
          path: release-assets
          merge-multiple: true

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -print)
          if (( ${#assets[@]} == 0 )); then
            echo 'No Windows or macOS installer assets were downloaded.' >&2
            exit 1
          fi

          release_flags=(--prerelease=false)
          if [[ "$TAG_NAME" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" --clobber "${assets[@]}"
            gh release edit "$TAG_NAME" "${release_flags[@]}"
            current_notes="$(gh release view "$TAG_NAME" --json body --jq '.body')"
            if [[ "$current_notes" != *'## Verification boundaries'* ]]; then
              gh release edit "$TAG_NAME" \
                --notes "$(cat docs/release-boundaries.md)"$'\n\n'"$current_notes"
            fi
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              "${release_flags[@]}" \
              --generate-notes \
              --notes "$(cat docs/release-boundaries.md)" \
              "${assets[@]}"
          fi

  mirror:
    name: Mirror installers to Cloudflare R2
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: geochat-*
          path: release-assets
          merge-multiple: true

      # Everything below is skipped rather than failed when R2 is not
      # configured, so the GitHub Release remains the source of truth and a
      # missing secret never blocks a release. The website falls back to the
      # GitHub API on its own when the selected channel manifest is absent.
      - name: Check R2 configuration
        id: config
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET }}
          DOWNLOADS_BASE: ${{ vars.DOWNLOADS_BASE_URL }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          if [[ "$TAG_NAME" == *-* ]]; then
            echo 'manifest=preview.json' >> "$GITHUB_OUTPUT"
          else
            echo 'manifest=latest.json' >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$API_TOKEN" && -n "$ACCOUNT_ID" && -n "$BUCKET" && -n "$DOWNLOADS_BASE" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::R2 mirroring skipped. Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets plus the R2_BUCKET and DOWNLOADS_BASE_URL variables to enable it.'
          fi

      - name: Set up Node
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build download manifest
        if: steps.config.outputs.ready == 'true'
        env:
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
          DOWNLOADS_BASE: ${{ vars.DOWNLOADS_BASE_URL }}
          MANIFEST_NAME: ${{ steps.config.outputs.manifest }}
        shell: bash
        run: |
          node scripts/build-r2-download-manifest.mjs \
            --assets release-assets \
            --tag "$TAG_NAME" \
            --base "$DOWNLOADS_BASE" \
            --repo "$GITHUB_REPOSITORY" \
            --out "release-assets/$MANIFEST_NAME"

      - name: Upload installers and manifest to R2
        if: steps.config.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET }}
          PREFIX: ${{ vars.R2_PREFIX || 'geochat' }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
          MANIFEST_NAME: ${{ steps.config.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar

          put() {
            npx --yes wrangler@4 r2 object put "$1" \
              --file="$2" \
              --content-type="$3" \
              --cache-control="$4" \
              --remote
          }

          # Installers live under a per-tag prefix and never change, so they are
          # cached for a year.
          uploaded=0
          for file in release-assets/**/*.dmg release-assets/**/*.exe release-assets/**/*.msi; do
            [[ -f "$file" ]] || continue
            name="$(basename "$file")"
            case "$name" in
              *.dmg) type='application/x-apple-diskimage' ;;
              *.msi) type='application/x-msi' ;;
              *)     type='application/vnd.microsoft.portable-executable' ;;
            esac

            echo "Uploading $name"
            put "$BUCKET/$PREFIX/$TAG_NAME/$name" "$file" "$type" \
              'public, max-age=31536000, immutable'
            uploaded=$((uploaded + 1))
          done

          if (( uploaded == 0 )); then
            echo 'No installers were found to mirror.' >&2
            exit 1
          fi

          # Each channel manifest gets a short TTL. Preview tags never replace
          # stable latest.json —
          # cache it for long and the download page keeps offering the previous
          # version. Uploaded last so it never points at objects that are not
          # there yet.
          put "$BUCKET/$PREFIX/$MANIFEST_NAME" "release-assets/$MANIFEST_NAME" \
            'application/json' 'public, max-age=300'

          echo "Mirrored $uploaded installer(s) to $BUCKET/$PREFIX/$TAG_NAME/"
